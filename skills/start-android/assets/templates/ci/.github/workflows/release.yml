# Publishing a GitHub Release (tag v1.2.3) uploads the prod AAB to the Play internal track.
name: Release

on:
  release:
    types: [published]

jobs:
  play:
    name: Android -> Play internal track
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
#@if sdk
      GPR_USER: ${{ github.actor }}
      GPR_API_KEY: ${{ secrets.GPR_API_KEY }}
#@endif
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - name: Unit tests
        run: ./gradlew testProdReleaseUnitTest testReleaseUnitTest
      - name: Build prod AAB
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :app:bundleProdRelease -PversionCode=${{ github.run_number }} -PversionName="$VERSION"
      - name: Upload to Play (internal)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: __APP_ID__
          releaseFiles: app/build/outputs/bundle/prodRelease/app-prod-release.aab
          track: internal
          status: completed
