name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + lint + assemble
    runs-on: ubuntu-latest
#@if sdk
    env:
      # Read access to the KMP SDK on GitHub Packages (a token with read:packages).
      GPR_USER: ${{ github.actor }}
      GPR_API_KEY: ${{ secrets.GPR_API_KEY }}
#@endif
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (every module)
        run: ./gradlew testDevDebugUnitTest testDebugUnitTest
      - name: Lint
        run: ./gradlew :app:lintDevDebug
      - name: Assemble
        run: ./gradlew :app:assembleDevDebug
